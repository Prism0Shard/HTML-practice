<!DOCTYPE html>
<html>
<head>
<title>List example</title>
</head>
<h1>Ordered List</h1>
<ol>
<li>Apple</li>
<li>Banana</li>
<li>Mango</li>
</ol>
<h2>Unordered List</h2>
<ul>
<li>Potato</li>
<li>Tomato</li>
<li>Carrot</li>
</ul>
<p>These are the ordered and unordered lists in HTML.</p>
</body>
</html>
